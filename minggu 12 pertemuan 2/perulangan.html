<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengulangan Loop</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 5; i++) {
            document.write("Perulangan ke-" + i + "<br>");
        }
    </script>
</body>
</html>
