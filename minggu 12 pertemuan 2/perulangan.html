<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengulangan Loop</title>
</head>
<body>
    <script>
        let i = 10;
        do {
            document.write("Perulangan ke-" + i + "</br>");
            i++;
        } while (i <= 1);
    </script>
</body>
</html>
