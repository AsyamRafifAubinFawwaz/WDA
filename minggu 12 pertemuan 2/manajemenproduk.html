<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 30px;
        }
        h2 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
        input, button {
            padding: 8px;
            margin: 5px;
        }
        button {
            background-color: #3a86ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #265df2;
        }
        #total {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>📦 Aplikasi Manajemen Produk</h2>

    <div>
        <input type="text" id="namaProduk" placeholder="Nama produk">
        <input type="number" id="hargaProduk" placeholder="Harga" min="0" step="any">
        <button id="tambahBtn">Tambah Produk</button>
        <button id="loadApiBtn">Ambil dari API</button>
    </div>
    <p id="pesan" role="status"></p>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Produk</th>
                <th>Harga (Rp)</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabelProduk"></tbody>
    </table>

    <p id="total">Total Harga: Rp 0</p>

    <script>
        let produkList = [
            { nama: "Roti", harga: 10000 },
            { nama: "Susu", harga: 15000 },
            { nama: "Kopi", harga: 12000 }
        ];

        const tabelProduk = document.getElementById("tabelProduk");
        const inputNama = document.getElementById("namaProduk");
        const inputHarga = document.getElementById("hargaProduk");
        const totalHargaEl = document.getElementById("total");
        const pesanEl = document.getElementById("pesan");

        function tampilkanProduk() {
            tabelProduk.innerHTML = "";
            let total = 0;

            produkList.forEach((item, index) => {
                total += item.harga;

                const row = document.createElement("tr");
                const nomor = document.createElement("td");
                const nama = document.createElement("td");
                const harga = document.createElement("td");
                const aksi = document.createElement("td");
                const tombolHapus = document.createElement("button");

                nomor.textContent = index + 1;
                nama.textContent = item.nama;
                harga.textContent = item.harga.toLocaleString("id-ID");
                tombolHapus.textContent = "Hapus";
                tombolHapus.addEventListener("click", function() {
                    hapusProduk(index);
                });
                aksi.appendChild(tombolHapus);
                row.append(nomor, nama, harga, aksi);
                tabelProduk.appendChild(row);
            });

            totalHargaEl.textContent = "Total Harga: Rp " + total.toLocaleString("id-ID");
        }

        function hapusProduk(index) {
            produkList.splice(index, 1);
            tampilkanProduk();
        }

        document.getElementById("tambahBtn").addEventListener("click", function() {
            const nama = inputNama.value.trim();
            const harga = Number(inputHarga.value);

            if (nama !== "" && inputHarga.value !== "" && Number.isFinite(harga) && harga >= 0) {
                produkList.push({ nama: nama, harga: harga });
                inputNama.value = "";
                inputHarga.value = "";
                pesanEl.textContent = "";
                tampilkanProduk();
            } else {
                pesanEl.textContent = "Isi nama produk dan harga yang valid terlebih dahulu.";
            }
        });

        document.getElementById("loadApiBtn").addEventListener("click", async function() {
            pesanEl.textContent = "Memuat produk dari API...";

            try {
                const response = await fetch("https://fakestoreapi.com/products?limit=3");
                if (!response.ok) {
                    throw new Error("Permintaan API gagal dengan status " + response.status);
                }

                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error("Format data dari API tidak valid.");
                }

                data.forEach(item => {
                    produkList.push({
                        nama: String(item.title).substring(0, 20),
                        harga: Math.floor(Number(item.price) * 15000)
                    });
                });

                pesanEl.textContent = "Produk dari API berhasil ditambahkan.";
                tampilkanProduk();
            } catch (error) {
                console.error("Gagal memuat data:", error);
                pesanEl.textContent = "Gagal memuat produk dari API. Periksa koneksi internet lalu coba lagi.";
            }
        });

        tampilkanProduk();
    </script>
</body>
</html>
