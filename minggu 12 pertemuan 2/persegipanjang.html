<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Luas Persegi Panjang</title>
</head>
<body>
    <h2>Menghitung Luas Persegi Panjang</h2>

    <input id="panjang" type="number" placeholder="Masukkan panjang">
    <input id="lebar" type="number" placeholder="Masukkan lebar">
    <button onclick="hitung()">Hitung</button>
    <p id="hasil"></p>

    <script>
        function hitung() {
            let panjang = Number(document.getElementById("panjang").value);
            let lebar = Number(document.getElementById("lebar").value);
            let luas = panjang * lebar;

            document.getElementById("hasil").innerHTML = "Luas = " + luas;
        }
    </script>
</body>
</html>
